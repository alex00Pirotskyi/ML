name: Long-press resting-state spectral audit
on:
  push:
    branches:
      - research/lp-rest-signatures

permissions:
  contents: read

jobs:
  lp-rest-spectral:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install numeric analysis dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy pandas
      - name: Examine per-zone spectral changes and resting signatures
        run: python3 scripts/lp_rest_spectral.py
