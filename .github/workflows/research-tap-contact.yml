name: Research TAP contact quality ablation

on:
  push:
    branches:
      - research/tap-emg-contact-20261117
    paths:
      - 'research/tap_contact/**'
      - '.github/workflows/research-tap-contact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DATA/DATA_TAP
            DATA/DATA_LONG_PRESS/CONNECTED
            DATA/DATA_LONG_PRESS/DISCONNECTED
            claude_research_tap
            research/tap_real
            research/tap_contact
            export_plus.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn lightgbm optuna joblib
      - name: Verify and run contact study on all frozen TAP recordings
        run: |
          python -m py_compile research/tap_contact/contact_research.py
          python -u research/tap_contact/contact_research.py 2>&1 | tee /tmp/tap_contact.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tap-contact-deep-research
          path: |
            research/tap_contact/results/report.json
            research/tap_contact/results/dataset_manifest.json
            /tmp/tap_contact.log
          if-no-files-found: warn
          retention-days: 30
