name: Long-press comprehensive data and contact audit
on:
  push:
    branches:
      - research/lp-rest-signatures

permissions:
  contents: read

jobs:
  lp-data-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install numeric ML libraries
        run: python3 -m pip install --disable-pip-version-check -q numpy pandas scikit-learn
      - name: Audit cohort timing contact and participant-held-out models
        run: python3 scripts/lp_deep_audit.py
