name: Long-press temporal activity and rest stress tests
on:
  push:
    branches:
      - research/lp-rest-signatures

permissions:
  contents: read

jobs:
  lp-temporal-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install numeric ML libraries
        run: python3 -m pip install --disable-pip-version-check -q numpy pandas scikit-learn
      - name: Evaluate relative EMG thresholds and baseline contamination
        run: python3 scripts/lp_temporal_benchmark.py
