name: Long-press electrode-quality feature ablations
on:
  push:
    branches:
      - research/lp-rest-signatures

permissions:
  contents: read

jobs:
  contact-feature-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install numeric ML libraries
        run: python3 -m pip install --disable-pip-version-check -q numpy pandas scikit-learn
      - name: Match subjects and test contact feature ablations
        run: python3 scripts/lp_contact_ablation.py
