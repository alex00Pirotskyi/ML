name: Long-press participant-held-out contact robustness
on:
  push:
    branches:
      - research/lp-rest-signatures

permissions:
  contents: read

jobs:
  lp-contact-heldout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install numeric ML dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy pandas scikit-learn
      - name: Contrast quality models on identical held-out people
        run: python3 scripts/lp_contact_heldout.py
