name: TAP V3 smoke tests and shape model
on:
  push:
    branches:
      - research/tap-real-benchmark-20261116
    paths:
      - '.github/workflows/tap-v3-shape-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DATA/DATA_TAP
            research/tap_real
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy scikit-learn lightgbm
      - name: Run stratified V3 sample
        run: |
          set -o pipefail
          python -u research/tap_real/weak_shape_mil_v3.py --sample-each 18 --out-dir research/tap_real/results_v3_smoke | tee tap_v3_smoke.log
      - name: Upload sample audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-v3-stratified-smoke
          path: |
            research/tap_real/results_v3_smoke/**
            tap_v3_smoke.log
