name: Gesture correlation research smoke

on:
  push:
    paths:
      - "gesture_correlation/**"
      - ".github/workflows/gesture-correlation-smoke.yml"
  pull_request:
    paths:
      - "gesture_correlation/**"
      - ".github/workflows/gesture-correlation-smoke.yml"
  workflow_dispatch:

jobs:
  synthetic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn lightgbm matplotlib
      - name: Compile and run synthetic tests
        run: |
          python -m py_compile gesture_correlation/analyze.py gesture_correlation/test_analyze.py
          python -m unittest gesture_correlation.test_analyze
