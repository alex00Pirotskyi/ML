name: Smoke test Claude V2 onset Optuna trainer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tap-claude-v2-trainer-smoke.yml'
      - 'research/tap_real/train_claude_v2_optuna.py'
      - 'research/tap_real/publish_tap_swipe_headers.py'
      - 'research/tap_real/train_optuna_student_v6.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DATA/DATA_TAP
            claude_research_tap
            research/tap_real
            export_plus.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model and exporter dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn lightgbm optuna joblib
      - name: Compile and run real-source label conversion and small model smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/tap_real/train_claude_v2_optuna.py research/tap_real/publish_tap_swipe_headers.py
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import numpy as np
          script=Path('research/tap_real/train_claude_v2_optuna.py')
          s=importlib.util.spec_from_file_location('claude_train',script)
          module=importlib.util.module_from_spec(s)
          s.loader.exec_module(module)
          assert module.CPU_THREADS == max(1,int(module.cpu_count()*0.8))
          assert module.v6.FIXED_DECISION_THRESHOLD == 0.85
          # A hard regression guard: threshold tuning must NOT reappear in Optuna.
          import inspect
          trial_code=inspect.getsource(module.v6.evaluate_trial)
          assert 'suggest_float("decision_threshold"' not in trial_code
          assert "threshold=FIXED_DECISION_THRESHOLD" in trial_code
          assert "trial.params[\"decision_threshold\"]" not in inspect.getsource(module.v6.export_selected)
          module.prepare()
          module.enable_full_feature_schema()
          assert module.CPU_THREADS == max(1,int(module.cpu_count()*0.8))
          assert len(module.FULL_126) == 126
          assert len(module.FEATURE_SETS['instant36']) == 36
          assert (module.ADAPTED/'manifest.jsonl').is_file()
          count=sum(1 for _ in module.ADAPTED.rglob('*.labels.csv.gz'))
          assert 2500 < count <= 2790, f'Adapted labels missing: {count}'
          out=Path('/tmp/tap_claude_small_smoke')
          out.mkdir(exist_ok=True)
          # Reproduce the Ubuntu-server failure: a recording has both
          # canonical .csv.gz and a locally decompressed .csv sibling.
          # Ensure source discovery selects the frozen compressed original,
          # including through the real hash-verified 126-feature loader.
          import gzip
          import shutil
          original=sorted(module.SOURCE.glob('ARM/*.csv.gz'))[0]
          plain=original.with_suffix('')
          assert not plain.exists(), f'Smoke duplicate unexpectedly exists: {plain}'
          with gzip.open(original,'rb') as read, open(plain,'wb') as write:
              shutil.copyfileobj(read,write)
          try:
              assert module.v6._source_for(module.SOURCE,'ARM',original.name[:-7]) == original
              data,info=module.v6.load_dataset(module.SOURCE,module.ADAPTED,out,
                                                max_per_class=6,sample_files=6,verify_hash=True)
          finally:
              plain.unlink()
          assert len(data['X']) and len(data['y']) and set(data['y'])=={0,1}
          assert len(data['columns']) == 126, f'Found {len(data["columns"])} columns'
          assert tuple(data['columns']) == module.FULL_126
          X=data['X']
          import lightgbm as lgb
          model=lgb.LGBMClassifier(objective='binary',n_estimators=12,
               num_leaves=7,max_depth=4,min_child_samples=3,
               verbosity=-1,n_jobs=module.CPU_THREADS,random_state=20261117)
          model.fit(X,data['y'],sample_weight=data['w'])
          prob=model.predict_proba(X)[:,1]
          assert np.isfinite(prob).all()
          size=module.v6.export_plus._estimate_compact_tree_payload_legacy(model)
          assert size['total_static_data_bytes']>0
          import json
          name='claude126_smoke'
          schema=out/'schema.json'
          schema.write_text(json.dumps({'feature_map':{str(i):c for i,c in enumerate(data['columns'])},
                                         'positive_class_id':1}))
          header=out/(name+'.h')
          report=module.v6.export_plus.export_to_c_header(
              {'model':model,'preprocessing':'none','indices':list(range(126))},
              {'group_name':name,'selected_indices':list(range(126)),
               'decision_threshold':module.v6.FIXED_DECISION_THRESHOLD,'target_class_id':1,
               'preprocessing':'none','params':model.get_params()},
              header,schema,validate=True)
          check=module.compile_header_126(header,name,out)
          assert check['status']=='passed' and check['all_feature_accessors_probed']==126
          assert int(report['total_static_data_bytes'])==int(size['total_static_data_bytes'])
          # Regression: the actual training exporter must NEVER emit a
          # rank/trial-prefixed .h, not even before final publishing.
          from types import SimpleNamespace
          import hashlib
          yi=np.asarray(data['y'],dtype=np.int8)
          positives=np.flatnonzero(yi==1)
          negatives=np.flatnonzero(yi==0)
          hold=np.concatenate([positives[:min(10,len(positives)//3)],
                               negatives[:min(10,len(negatives)//3)]])
          train=np.setdiff1d(np.arange(len(yi)),hold)
          assert set(yi[hold])=={0,1} and set(yi[train])=={0,1}
          trial=SimpleNamespace(number=15,params={'positive_weight':1.0},
              user_attrs={'training_params':model.get_params(),
                          'selected_features':list(data['columns']),
                          'cv':{'f1':0.9},'folds':[]},
              values=(0.9,size['total_static_data_bytes']))
          fresh=out/'direct_training_export'
          ranked=module.v6.export_selected(
              data,train,hold,None,[trial],fresh,20261117,
              stable_headers=True,
              header_postprocess=module._add_uppercase_predict_alias)
          assert ranked[0]['header']=='candidates/rank_01/TAP_SWIPE.h'
          direct_header=fresh/'models'/ranked[0]['header']
          text_header=direct_header.read_text()
          assert '#ifndef TAP_SWIPE_MODEL_H' in text_header
          assert '#define TAP_SWIPE_predict tap_swipe_predict' in text_header
          assert '#define TAP_SWIPE_THRESHOLD 0.850000024f' in text_header
          assert 'V6_RANK' not in text_header and 'v6_rank' not in text_header
          assert not list((fresh/'models').glob('*rank*.h'))
          print('TRAINER_DIRECT_STABLE_HEADER_OK',ranked[0]['header'],flush=True)
          # Simulate existing completed Optuna study. Re-publish saved
          # .pkl as stable TAP_SWIPE.h without running Optuna again.
          from publish_tap_swipe_headers import _select_default
          assert _select_default([
              {'rank':1,'cv_f1':0.966070,'actual_static_bytes':28520},
              {'rank':6,'cv_f1':0.942786,'actual_static_bytes':3924},
              {'rank':7,'cv_f1':0.952499,'actual_static_bytes':5084},
          ])['rank']==7
          import joblib
          bundle=out/'frozen_experiment'
          (bundle/'models').mkdir(parents=True)
          tag='tap_swipe_v6_rank07_trial033'
          joblib.dump({'model':model,'preprocessing':'none',
                       'indices':list(range(126)),'feature_names':data['columns']},
                       bundle/'models'/(tag+'.pkl'),compress=3)
          legacy_header=bundle/'models'/(tag+'.h')
          legacy_header.write_text('/* generated old V6_RANK07_TRIAL033 model */\n')
          old_sha=hashlib.sha256(legacy_header.read_bytes()).hexdigest()
          (bundle/'models'/(tag+'.json')).write_text(json.dumps({
              'rank':7,'optuna_trial':33,
              'files':{'header':legacy_header.name,'header_sha256':old_sha},
              'final_model':{'features':data['columns'],
                             'params':model.get_params(),
                             'decision_threshold':module.v6.FIXED_DECISION_THRESHOLD}}))
          (bundle/'summary.json').write_text(json.dumps({
              'status':'success','fixed_decision_threshold':0.85,
              'threshold_optimized_by_optuna':False,'selected_models':1,
              'ranking':[{'rank':7,'trial':33,'header':tag+'.h',
                          'json':tag+'.json','cv_f1':0.952499,
                          'holdout_f1':0.960744,'actual_static_bytes':size['total_static_data_bytes'],
                          'feature_count':126}]}))
          stable=module.publish_stable_headers(bundle,compile_header=module.compile_header_126)
          h=(bundle/'models'/'TAP_SWIPE.h').read_text()
          assert stable['selected_rank']==7
          assert '#ifndef TAP_SWIPE_MODEL_H' in h
          assert '#define TAP_SWIPE_predict tap_swipe_predict' in h
          assert 'tap_swipe_predict(const t_core* p_core)' in h
          assert '#define TAP_SWIPE_NUM_FEATURES 126u' in h
          assert '#define TAP_SWIPE_THRESHOLD 0.850000024f' in h
          assert json.loads((bundle/'models'/'TAP_SWIPE_model_info.json').read_text())['decision_threshold'] == 0.85
          assert 'v6_rank' not in h.lower()
          assert (bundle/'models'/'candidates'/'rank_07'/'TAP_SWIPE.h').is_file()
          assert (bundle/'models'/'TAP_SWIPE_feature_schema.json').is_file()
          assert (bundle/'models'/'TAP_SWIPE_VARIANTS.json').is_file()
          assert not legacy_header.exists(), 'Previous versioned .h was not cleaned'
          new_summary=json.loads((bundle/'summary.json').read_text())
          assert new_summary['ranking'][0]['header']=='candidates/rank_07/TAP_SWIPE.h'
          stable2=module.publish_stable_headers(bundle,compile_header=module.compile_header_126)
          assert stable2['selected_rank']==7 and not legacy_header.exists()
          assert not list((bundle/'models').glob('*rank*.h'))
          print('LEGACY_RANK_HEADER_REMOVAL_OK',flush=True)
          print('STABLE_TAP_SWIPE_HEADER_SMOKE_OK',{'model_bytes':size['total_static_data_bytes'],
              'file':'TAP_SWIPE.h','guard':'TAP_SWIPE_MODEL_H','default_rank':7},flush=True)
          print('CLAUDE_V2_126_EXPORT_SMOKE_OK',{'sources':info['source_files'],
                'samples':len(data['y']),'features':len(data['columns']),
                'model_bytes':size['total_static_data_bytes'],
                'cpu_threads':module.CPU_THREADS,'c_status':check['status']},flush=True)
          PY
