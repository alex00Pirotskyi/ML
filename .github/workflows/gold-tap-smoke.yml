name: GOLD TAP labeler smoke
on:
  push:
    branches: [research/tap-v11-reviewed-seed]
    paths:
      - 'research/tap_v11/gold_labeler.py'
      - 'research/tap_v11/test_gold_labeler.py'
      - '.github/workflows/gold-tap-smoke.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: research/tap_v11
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy pandas
      - run: python -m py_compile research/tap_v11/gold_labeler.py research/tap_v11/test_gold_labeler.py
      - run: python -m unittest discover -s research/tap_v11 -p 'test_gold_labeler.py' -v
