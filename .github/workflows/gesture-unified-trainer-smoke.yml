name: Smoke test unified TAP + LP Claude trainer

on:
  push:
    branches: [main]
    paths:
      - 'research/gesture/train_unified.py'
      - 'research/gesture/test_unified_smoke.py'
      - 'research/gesture/replay.py'
      - 'research/gesture/generate_lean8_features.py'
      - 'research/gesture/generate_lean_lite_features.py'
      - 'research/gesture/tap_features.py'
      - 'research/gesture/tap_generalization_research.py'
      - 'research/gesture/tap_gestures.py'
      - 'research/gesture/test_tap_gestures.py'
      - 'research/gesture/tap_gestures_strict.py'
      - 'research/gesture/firmware/**'
      - 'research/gesture/bench_unified.py'
      - 'research/gesture/feature_selection.py'
      - 'research/gesture/fs_research.py'
      - 'research/gesture/validate_events.py'
      - 'research/gesture/prepare_run.py'
      - 'research/gesture/tap_top_research.py'
      - 'claude_labeling/**'
      - 'tests/test_tap_top.py'
      - 'tests/test_label_file_folds.py'
      - 'tests/test_fs_fast_shift.py'
      - 'Makefile'
      - 'org.py'
      - 'tests/test_org_mapping.py'
      - '.github/workflows/gesture-unified-trainer-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DATA/DATA_TAP/TAP
            DATA/DATA_TAP/SWIPE
            DATA/DATA_TAP/FINGER
            DATA/DATA_TAP/ARM
            DATA/DATA_TAP/WRIST
            DATA/DATA_TAP/BAND
            DATA/DATA_LONG_PRESS/SOFT_LONG_PRESS
            DATA/DATA_LONG_PRESS/MID_LONG_PRESS
            DATA/DATA_LONG_PRESS/STRONG_LONG_PRESS
            DATA/DATA_LONG_PRESS/DRAG_AND_DROP
            DATA/DATA_LONG_PRESS/LONG_PRESS
            DATA/DATA_LONG_PRESS/CONNECTED
            DATA/DATA_LONG_PRESS/DISCONNECTED
            DATA/DATA_LONG_PRESS/LOOSE
            DATA/DATA_LONG_PRESS/TABLE
            DATA/DATA_LONG_PRESS/TAP
            DATA/DATA_LONG_PRESS/SWIPE
            claude_labeling
            research/tap_real
            research/gesture
            tests
            export_plus.py
            org.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight training dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy scikit-learn lightgbm optuna joblib pytest
      - name: Cross-compile Lean-lite for Cortex-M4 with the real CMSIS headers
        run: bash research/gesture/firmware/check_arm_build.sh
      - name: Single / double tap rule, C vs Python
        run: python -u research/gesture/test_tap_gestures.py
      - name: org.py routing regressions
        run: python -m pytest -q tests/test_org_mapping.py
      - name: Top labels and file-fold labeller (no person folds)
        run: python -m pytest -q tests/test_tap_top.py tests/test_label_file_folds.py tests/test_fs_fast_shift.py
      - name: Compile and execute real-source two-model smoke
        run: |
          python -m py_compile research/gesture/train_unified.py research/gesture/replay.py research/gesture/generate_lean8_features.py research/gesture/generate_lean_lite_features.py research/gesture/tap_features.py research/gesture/tap_generalization_research.py research/gesture/bench_unified.py research/gesture/ablate_lean8.py research/gesture/feature_selection.py research/gesture/fs_research.py research/gesture/validate_events.py research/gesture/test_unified_smoke.py research/gesture/tap_gestures.py research/gesture/tap_gestures_research.py research/gesture/tap_gestures_strict.py research/gesture/test_tap_gestures.py research/gesture/tap_focus_fw_rule.py research/gesture/tap_extra_cache.py research/gesture/tap_observable_research.py research/gesture/prepare_run.py research/gesture/tap_top_research.py claude_labeling/tap_top.py claude_labeling/plot_tap_top.py claude_labeling/teacher/make_file_folds.py claude_labeling/teacher/export_teacher.py
          python -u research/gesture/test_unified_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-tap-lp-smoke-reports
          path: |
            research/gesture/_smoke_results/tap/summary.json
            research/gesture/_smoke_results/lp/summary.json
            research/gesture/_smoke_results/tap/models/TAP_SWIPE.h
            research/gesture/_smoke_results/lp/models/LONG_PRESS.h
            research/gesture/_smoke_results/COMPARISON.md
            research/gesture/_smoke_results_lite/tap/summary.json
            research/gesture/_smoke_results_lite/lp/summary.json
            research/gesture/_smoke_results_lite/COMPARISON.md
            research/gesture/_smoke_results_no_lean8_tap-diff-mild/tap/summary.json
            research/gesture/_smoke_results_no_lean8_tap-diff-mild/COMPARISON.md
            research/gesture/_smoke_results_no_lean8_tap-diff-mild-litediff-press2-kb14-leaves4-15/tap/summary.json
            research/gesture/_smoke_results_no_lean8_tap-diff-mild-litediff-press2-kb14-leaves4-15/tap/COMPARISON.md
            research/gesture/_smoke_results_no_lean8_tap-diff-mild-litediff-press2-obs60-kb14-leaves4-15/tap/summary.json
            research/gesture/_smoke_results_no_lean8_tap-diff-mild-litediff-press2-obs60-kb14-leaves4-15/tap/COMPARISON.md
            research/gesture/_smoke_results_no_lean8_tap-diff-mild-litediff-press2-kb14-leaves4-15_splitfile/tap/summary.json
            research/gesture/_smoke_results_no_lean8_tap-diff-mild-litediff-press2-top-kb14-leaves4-15_splitfile/tap/summary.json
            research/gesture/_smoke_results_no_lean8_tap-diff-mild-litediff-press2-top-kb14-leaves4-15_splitfile/tap/COMPARISON.md
          if-no-files-found: warn
          retention-days: 7
