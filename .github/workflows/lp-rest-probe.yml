name: Long-press contact-vs-activation robustness audit
on:
  push:
    branches:
      - research/lp-rest-signatures

permissions:
  contents: read

jobs:
  lp-contact-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install numeric ML dependencies
        run: python3 -m pip install --disable-pip-version-check -q numpy pandas scikit-learn
      - name: Test contact heuristics under long-press muscle activity
        run: python3 scripts/lp_contact_activity_stress.py
