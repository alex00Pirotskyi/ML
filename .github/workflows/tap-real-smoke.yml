name: TAP stratified real-data smoke benchmark
on:
  push:
    branches:
      - research/tap-real-benchmark-20261116
    paths:
      - '.github/workflows/tap-real-smoke.yml'
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DATA/DATA_TAP
            research/tap_real
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy
      - name: Run stratified sample including all DoubleTaps
        run: python -u research/tap_real/benchmark.py 12 | tee tap_smoke.log
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-stratified-smoke
          path: |
            research/tap_real/results/**
            tap_smoke.log
