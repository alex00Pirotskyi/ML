name: LP V5 research corpus snapshot

on:
  push:
    branches:
      - research/lp-state-strict-v4
    paths:
      - .github/workflows/lp-v5-research-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Sparse checkout research sources
        uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /DATA/DATA_LONG_PRESS/SOFT_LONG_PRESS/
            /DATA/DATA_LONG_PRESS/MID_LONG_PRESS/
            /DATA/DATA_LONG_PRESS/STRONG_LONG_PRESS/
            /DATA/DATA_LONG_PRESS/LONG_PRESS/
            /DATA/DATA_LONG_PRESS/CONNECTED/
            /DATA/DATA_LONG_PRESS/DISCONNECTED/
            /DATA/DATA_LONG_PRESS/LOOSE/
            /DATA/DATA_LONG_PRESS/NOTHING/
            /DATA/DATA_LONG_PRESS/TABLE/
            /lp_state_v4.py
            /lp_state_v4_partial.py
            /lp_v3_teacher.py
            /lp_v3_labeler.py
            /lp_causal_fw_teacher.py
            /lp_rest_labeler.py
            /scripts/lp_v3_feature_probe.py
            /scripts/lp_v5_event_study.py
            /scripts/lp_v5_spectral_probe.py

      - name: Publish read-only research snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lp-v5-research-corpus
          path: |
            DATA/DATA_LONG_PRESS/SOFT_LONG_PRESS
            DATA/DATA_LONG_PRESS/MID_LONG_PRESS
            DATA/DATA_LONG_PRESS/STRONG_LONG_PRESS
            DATA/DATA_LONG_PRESS/LONG_PRESS
            DATA/DATA_LONG_PRESS/CONNECTED
            DATA/DATA_LONG_PRESS/DISCONNECTED
            DATA/DATA_LONG_PRESS/LOOSE
            DATA/DATA_LONG_PRESS/NOTHING
            DATA/DATA_LONG_PRESS/TABLE
            lp_state_v4.py
            lp_state_v4_partial.py
            lp_v3_teacher.py
            lp_v3_labeler.py
            lp_causal_fw_teacher.py
            lp_rest_labeler.py
            scripts/lp_v3_feature_probe.py
            scripts/lp_v5_event_study.py
            scripts/lp_v5_spectral_probe.py
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
