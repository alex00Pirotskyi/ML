name: Long-press unsupervised rest-state discovery
on:
  push:
    branches:
      - research/lp-rest-signatures

permissions:
  contents: read

jobs:
  lp-unsupervised:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install numeric libraries
        run: python3 -m pip install --disable-pip-version-check -q numpy pandas scikit-learn
      - name: Compare one- and two-state EMG mixtures across conditions
        run: python3 scripts/lp_unsupervised_states.py
