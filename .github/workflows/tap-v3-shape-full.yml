name: TAP V3 complete event-shape and refractory benchmark
on:
  push:
    branches:
      - research/tap-real-benchmark-20261116
    paths:
      - '.github/workflows/tap-v3-shape-full.yml'
  workflow_dispatch:
jobs:
  tap_v3:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DATA/DATA_TAP
            research/tap_real
            .github/workflows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research requirements
        run: python -m pip install --disable-pip-version-check 'numpy>=2.0' pandas scipy scikit-learn lightgbm
      - name: Run full corpus with user-held-out scoring
        run: |
          set -o pipefail
          python -u research/tap_real/weak_shape_mil_v3.py --input-dir DATA/DATA_TAP --out-dir research/tap_real/results_v3 2>&1 | tee tap_v3_benchmark.log
      - name: Upload reproducible full V3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-v3-full-event-shape-research
          path: |
            research/tap_real/results_v3/**
            tap_v3_benchmark.log
          retention-days: 30
